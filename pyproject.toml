[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insightfold"
version = "0.1.0"
description = "InsightFold – Variants v1"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Maxim Tsenkov" }]
dependencies = [
  "pandas>=2,<3",
  "requests>=2.31,<3",
  "ipywidgets>=8,<9",
  "py3Dmol>=2,<3",
  "gemmi>=0.6,<1",
  "matplotlib>=3.10.7",
  "seaborn>=0.13,<1",
  "molviewspec>=0.1",
  "ipykernel>=6,<8",
  "jupyter>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insightfold"]

[tool.hatch.build.targets.sdist]
include = [
  "src/insightfold/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
